name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          fi
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD; then
            node scripts/code-changes.mjs "$base" >> "$GITHUB_OUTPUT"
          else
            echo 'code=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npx astro check
      - run: npm run build
      - if: steps.changes.outputs.code == 'true'
        run: npm test
