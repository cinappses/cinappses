<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>cinappses admin</title>
<link rel="stylesheet" href="/admin/board.css">
<style>
:root:root[data-theme] {
  color-scheme: light;
  --sui-base-hue: 26;
  --sui-font-family-default: Seravek, "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", source-sans-pro, sans-serif;
  --sui-foreground-color-1-hsl: 18 29% 9%;
  --sui-foreground-color-2-hsl: 18 22% 20%;
  --sui-foreground-color-3-hsl: 18 16% 30%;
  --sui-foreground-color-4-hsl: 18 12% 40%;
  --sui-foreground-color-5-hsl: 20 12% 58%;
  --sui-background-color-1-hsl: 40 100% 97%;
  --sui-background-color-2-hsl: 42 100% 94%;
  --sui-background-color-3-hsl: 42 100% 92%;
  --sui-background-color-4-hsl: 38 85% 86%;
  --sui-background-color-5-hsl: 30 70% 76%;
  --sui-border-color-1-hsl: 18 29% 9%;
  --sui-border-color-2-hsl: 22 35% 45%;
  --sui-border-color-3-hsl: 28 50% 72%;
  --sui-shadow-color: 18 29% 9%;
  --sui-primary-accent-color-text: hsl(22 65% 38%);
  --sui-primary-accent-color-light: hsl(24 70% 46%);
  --sui-primary-accent-color: hsl(22 65% 40%);
  --sui-primary-accent-color-dark: hsl(20 65% 32%);
  --sui-primary-accent-color-inverted: hsl(40 100% 97%);
  --sui-primary-accent-color-translucent: hsl(26 83% 67% / 60%);
  --sui-primary-accent-color-translucent-light: hsl(26 83% 67% / 40%);
}
.publish-bar { display: inline-flex; }
@media (max-width: 1200px) { .publish-note { display: none; } }
@media (max-width: 600px) { .publish-bar { display: none; } }
</style>
</head>
<body>
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
<script type="module">
import Board from "/admin/board.js";
import { photo, photos } from "/admin/photos.js";
import { dropdown } from "/admin/dropdown.js";
import { start } from "/admin/publish.js?v=2";
CMS.registerFieldType("photo-board", Board);
CMS.registerEditorComponent(photo);
CMS.registerEditorComponent(photos);
CMS.registerEditorComponent(dropdown);
CMS.registerPreviewStyle("/photos.css");
CMS.registerPreviewStyle("/prose.css");
CMS.registerPreviewStyle("body { background: #fffaf0; color: #1d1410; font: 17px/1.5 Seravek, \"Gill Sans Nova\", Ubuntu, Calibri, \"DejaVu Sans\", source-sans-pro, sans-serif; }", { raw: true });
start();
</script>
</body>
</html>
