backend:
  name: github
  repo: cinappses/cinappses
  branch: main
  skip_ci: true

app_title: cinappses
site_url: https://cinappses.org
display_url: https://cinappses.org
editor:
  preview: false

media_folder: public/uploads
public_folder: /uploads

singletons:
  - name: tags
    label: Art tags
    icon: sell
    file: src/data/tags.json
    fields:
      - { name: tags, label: Tags, label_singular: Tag, widget: list }

collections:
  - name: status
    label: Status
    icon: chat_bubble
    folder: src/content/status
    create: true
    identifier_field: date
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    summary: "{{date}}"
    fields:
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: body, label: Status, widget: markdown, buttons: [bold, italic, link], editor_components: [] }

  - name: art
    label: Art
    label_singular: Art
    icon: palette
    folder: src/content/art
    media_folder: img
    public_folder: img
    create: true
    sortable_fields: [date, title]
    thumbnail: image
    summary: "{{title}} ({{date}})"
    fields:
      - { name: image, label: Image (full size), widget: image, choose_url: false }
      - { name: title, label: Name }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: caption, label: Description, widget: text, required: false }
      - { name: tags, label: Tags, widget: relation, collection: _singletons, file: tags, value_field: "tags.*", search_fields: ["tags.*"], display_fields: ["tags.*"], multiple: true, required: false }

  - name: applings
    label: Applings
    label_singular: Appling
    icon: pets
    folder: src/content/applings
    media_folder: img
    public_folder: img
    create: true
    identifier_field: name
    thumbnail: image
    fields:
      - { name: image, label: Image, widget: image, choose_url: false, required: false }
      - { name: name, label: Name }
      - { name: link, label: Link, required: false }

  - name: posts
    label: Blog
    label_singular: Post
    icon: edit_note
    folder: src/content/posts
    media_folder: img
    public_folder: img
    create: true
    sortable_fields: [date, title]
    summary: "{{title}} ({{date}})"
    fields:
      - { name: title, label: Title }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: body, label: Post, widget: markdown }

  - name: scans
    label: Scans
    label_singular: Scan
    icon: menu_book
    folder: src/content/scans
    media_folder: /public/scans
    public_folder: /scans
    create: true
    sortable_fields: [date, title]
    summary: "{{title}} ({{date}})"
    fields:
      - { name: file, label: PDF, widget: file, accept: application/pdf, choose_url: false }
      - { name: title, label: Title }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: body, label: Notes, widget: markdown, required: false }

  - name: guestbook
    label: Guestbook
    label_singular: Entry
    icon: forum
    folder: src/content/guestbook
    create: false
    sortable_fields: [date]
    summary: "{{name}}: {{message}}"
    fields:
      - { name: name, label: Name }
      - { name: date, label: Date, widget: datetime }
      - { name: site, label: Website, required: false }
      - { name: message, label: Message, widget: text }

  - name: pages
    label: Pages
    icon: description
    files:
      - name: home
        label: Home
        file: src/content/pages/home.md
        fields:
          - { name: title, label: Title, widget: hidden }
          - { name: body, label: Text, widget: markdown }
      - name: about
        label: About
        file: src/content/pages/about.md
        fields:
          - { name: title, label: Title, widget: hidden }
          - { name: body, label: Text, widget: markdown }
